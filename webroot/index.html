<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f2f3f5">
<title>Magpie</title>
<style>
  :root {
    --bg: #f2f3f5;
    --card: #ffffff;
    --text: #18191b;
    --muted: #8b8f96;
    --line: #e5e7ea;
    --accent: #2f6fed;
    --ok: #12b76a;
    --err: #f04438;
    --nav-h: 56px;
    --mono: ui-monospace, "Roboto Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1012;
      --card: #1a1c1f;
      --text: #eceef1;
      --muted: #8b9098;
      --line: #2a2d32;
      --accent: #5b91ff;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: 600px;
    margin-inline: auto;
    overflow-x: hidden;
  }

  /* ---------- 页面容器 ---------- */
  .page {
    display: none;
    padding: 10px 10px 10px;
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
  }
  .page.active { display: block; }

  /* ---------- 顶部状态条 ---------- */
  .bar {
    display: flex; align-items: center; gap: 8px;
    padding: 11px 13px; margin-bottom: 9px;
    background: var(--card); border-radius: 12px;
    border: 1px solid var(--line);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); flex: 0 0 auto;
  }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 16%, transparent); }
  .dot.off { background: var(--err); box-shadow: 0 0 0 3px color-mix(in srgb, var(--err) 14%, transparent); }
  .bar-t { font-weight: 600; font-size: 14px; }
  .bar-s { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---------- 卡片 ---------- */
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; margin-bottom: 9px; overflow: hidden;
  }
  .card-h {
    display: flex; align-items: center; gap: 7px;
    padding: 11px 13px 9px; font-size: 12px; font-weight: 700;
    color: var(--muted); letter-spacing: .02em;
  }
  .dotmark {
    width: 6px; height: 6px; border-radius: 2px; flex: 0 0 auto;
    background: var(--accent);
  }
  .dotmark.b { background: #8b5cf6; }

  /* ---------- 字段 ---------- */
  .f {
    padding: 9px 13px; border-top: 1px solid var(--line);
    min-width: 0;
  }
  .f-k {
    font-size: 11px; color: var(--muted);
    margin-bottom: 4px;
  }
  /* 地址独占一行, 按钮在下一行靠右 —— 永远不会互相挤压 */
  .f-v {
    display: block;
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    min-width: 0;
    font: 12px/1.45 var(--mono);
    color: var(--text);
    word-break: break-all;
    overflow-wrap: anywhere;
    -webkit-user-select: text; user-select: text;
  }
  .f-act {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-start;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    width: 100%;
  }
  .f-v.masked { color: var(--muted); font-family: inherit; letter-spacing: .05em; }

  /* ---------- 图标按钮 ---------- */
  .ic {
    flex: 0 0 auto;
    width: 34px; height: 34px;
    min-width: 34px; min-height: 34px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 0; background: transparent; border-radius: 8px;
    color: var(--accent);
    font-size: 0; line-height: 0;
    cursor: pointer; padding: 0;
    transition: background .15s, color .15s, transform .08s;
  }
  /* 用 flex 居中, 不依赖 svg */
  .ic > span { display: block; }
  .ic:active { transform: scale(.9); }

  /* 文字按钮 (最可靠) */
  .ic.txt {
    width: auto !important;
    min-width: 56px !important;
    height: 32px; min-height: 32px;
    padding: 0 12px;
    font-size: 12px !important;
    line-height: 30px;
    font-weight: 600; font-family: inherit;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--accent) !important;
    border-radius: 8px;
    display: inline-block !important;
  }
  .ic.txt:active { transform: scale(.96); opacity: .75; }
  .ic.txt:disabled { color: var(--muted) !important; cursor: default; opacity: .55; }

  /* 底部导航图标 */
  .ni {
    display: block; position: relative;
    width: 20px; height: 20px;
  }
  .ni-home::before {
    content: ""; position: absolute;
    left: 1px; top: 9px; width: 18px; height: 10px;
    border: 2px solid currentColor; border-top: 0;
    border-radius: 0 0 2px 2px;
  }
  .ni-home::after {
    content: ""; position: absolute;
    left: 4px; top: 3px; width: 12px; height: 12px;
    border-left: 2px solid currentColor;
    border-top: 2px solid currentColor;
    transform: rotate(45deg);
    background: transparent;
  }
  .ni-log::before {
    content: ""; position: absolute;
    left: 3px; top: 2px; width: 12px; height: 16px;
    border: 2px solid currentColor; border-radius: 2px;
  }
  .ni-log::after {
    content: ""; position: absolute;
    left: 6px; top: 7px; width: 8px; height: 1.8px;
    background: currentColor;
    box-shadow: 0 4px 0 currentColor;
  }

  /* ---------- 主按钮 ---------- */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin: 10px 13px 12px; width: calc(100% - 26px);
    border: 0; font-family: inherit; cursor: pointer;
    padding: 12px;
    background: var(--accent); color: #fff;
    border-radius: 10px;
    font-size: 14px; font-weight: 600; text-decoration: none;
    transition: opacity .15s, transform .08s;
  }
  .btn:active { transform: scale(.98); opacity: .82; }
  .btn:disabled { background: var(--muted); pointer-events: none; opacity: .45; }

  .tip { padding: 0 13px 12px; font-size: 11px; line-height: 1.55; color: var(--muted); }

  /* ---------- 日志 ---------- */
  pre#log {
    margin: 0; padding: 11px 13px 13px;
    font: 11px/1.5 var(--mono);
    color: var(--muted);
    max-height: 60vh; overflow: auto;
    white-space: pre-wrap; word-break: break-all;
  }

  /* ---------- 底部导航 ---------- */
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; height: var(--nav-h);
    background: var(--card);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
    max-width: 600px; margin-inline: auto;
    z-index: 50;
  }
  .nav-i {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
    border: 0; background: transparent; cursor: pointer;
    color: var(--muted); font: inherit; font-size: 11px;
    padding: 0; transition: color .15s;
  }
  .nav-i svg { display: block; }
  .nav-i.on { color: var(--accent); font-weight: 600; }

  /* 给底部导航留空间 */
  .pages { padding-bottom: calc(var(--nav-h) + 8px + env(safe-area-inset-bottom)); }

  /* ---------- toast ---------- */
  #toast {
    position: fixed; left: 50%; bottom: calc(var(--nav-h) + 20px);
    transform: translateX(-50%) translateY(10px);
    background: #24262b; color: #fff;
    padding: 9px 15px; border-radius: 9px;
    font-size: 13px; max-width: 86vw; text-align: center;
    opacity: 0; pointer-events: none;
    transition: opacity .18s, transform .18s;
    z-index: 99;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="pages">

  <!-- ========== 页面 1: 首页 ========== -->
  <div class="page active" id="page-home">
    <div class="bar">
      <span class="dot" id="statusDot"></span>
      <span class="bar-t" id="statusText">检测中</span>
      <span class="bar-s" id="barSub"></span>
    </div>

    <div class="card">
      <div class="card-h"><span class="dotmark a"></span>API 接入</div>

      <div class="f">
        <div class="f-k">接口地址（配置候选）</div>
        <div class="f-v" id="vApiUrl">—</div>
        <div class="f-act"><button class="ic txt" id="copyApiUrl" data-copy="vApiUrl" title="复制接口地址" disabled>复制</button>
        </div>
      </div>

      <div class="f">
        <div class="f-k">API Key</div>
        <div class="f-v masked" id="vApiKey">密钥不通过状态快照暴露；请在本体管理界面管理</div>
      </div>

      <div class="f" id="fLanApi" style="display:none">
        <div class="f-k">局域网地址（配置候选）</div>
        <div class="f-v" id="vLanApi">—</div>
        <div class="f-act"><button class="ic txt" id="copyLanApi" data-copy="vLanApi" title="复制局域网地址" disabled>复制</button>
        </div>
      </div>

      <div class="tip" id="tipApi"></div>
    </div>

    <div class="card">
      <div class="card-h"><span class="dotmark b"></span>控制台</div>

      <div class="f">
        <div class="f-k">最近核验的回环地址</div>
        <div class="f-v" id="vWebUrl">—</div>
        <div class="f-act"><button class="ic txt" id="copyWebUrl" data-copy="vWebUrl" title="复制无密码的回环地址" disabled>复制</button>
        </div>
      </div>

      <div class="f">
        <div class="f-k">访问密码</div>
        <div class="f-v masked" id="vWebKey">访问密码不通过状态快照提供</div>
      </div>

      <button type="button" class="btn" id="btnOpen" disabled>当前宿主不支持直接进入</button>
      <div class="tip">支持的宿主可重新核验并进入本体面板。若上方显示了无密码的回环地址，也可复制到外部浏览器手动打开。</div>
    </div>
  </div>

  <!-- ========== 页面 2: 日志 ========== -->
  <div class="page" id="page-log">
    <div class="card" style="margin-bottom:0">
      <div class="card-h"><span class="dotmark c"></span>日志快照（最近 30 行，非实时）</div>
      <pre id="log">加载中…</pre>
    </div>
  </div>

</div>

<!-- 底部导航 -->
<div class="nav">
  <button class="nav-i on" data-page="page-home">
    <span class="ni ni-home"></span>首页
  </button>
  <button class="nav-i" data-page="page-log">
    <span class="ni ni-log"></span>日志
  </button>
</div>

<div id="toast" role="status"></div>
<script>
(function () {
'use strict';
function $(id) { return document.getElementById(id); }
function toast(msg) {
  var el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(function () { el.classList.remove('show'); }, 1600);
}

var page = 'page-home', away = false, copySerial = 0;
function visible() { return !away && !document.hidden; }

/* ---------- P2：只展示无凭据的快照，不据此决定能否进入 P1 ---------- */
function panelAddress(s) {
  // 对齐控制器 / 磁贴：规范十进制 127/8 或 [::1]，端口 1..65535，路径仅 /。
  var m = typeof s === 'string' && /^http:\/\/(127(?:\.(?:0|[1-9][0-9]{0,2})){3}|\[::1\]):([1-9][0-9]{0,4})\/$/.exec(s);
  return m && +m[2] <= 65535 && (m[1] === '[::1]' ||
    m[1].split('.').every(function (n) { return +n <= 255; })) ? s : '';
}
function apiAddress(s) {
  // 与 magpie_config_url 一致，只显示配置候选；不接受用户信息、查询串或片段。
  var m = typeof s === 'string' && /^http:\/\/(?:[A-Za-z0-9.-]+|\[[A-Fa-f0-9:.]+\]):([1-9][0-9]{0,4})\/v1$/.exec(s);
  return m && +m[1] <= 65535 ? s : '';
}
function address(id, button, value) {
  $(id).textContent = value || '—';
  $(button).disabled = !value;
}
function addresses(api, lan, web) {
  address('vApiUrl', 'copyApiUrl', api);
  address('vLanApi', 'copyLanApi', lan);
  address('vWebUrl', 'copyWebUrl', web);
  $('fLanApi').style.display = lan ? '' : 'none';
}
function unknownStatus(label, detail) {
  copySerial++;
  $('statusDot').className = 'dot';
  $('statusText').textContent = label;
  $('barSub').textContent = detail || '';
  $('tipApi').textContent = '';
  addresses('', '', '');
}
function render(d) {
  if (!d || typeof d.running !== 'boolean') throw new Error('invalid snapshot');
  // 默认看门狗约 150 秒写一次。5 分钟是展示新鲜度上限，不是判定服务停止的超时。
  // 旧版只有 HH:MM:SS，不能分辨是哪一天；读取成功也不能续期。
  var ts = d.updatedEpoch, age = Math.floor(Date.now() / 1000) - ts;
  if (!Number.isSafeInteger(ts) || ts <= 0 || age < 0) {
    unknownStatus('快照时间未知', '无法判断当前状态，请等待新快照或运行自检。');
    return;
  }
  var stamp = '采样 ' + new Date(ts * 1000).toLocaleString();
  if (age > 300) {
    unknownStatus('快照已过期', stamp + ' · 超过 5 分钟，当前状态未知');
    return;
  }
  if (d.configError) {
    unknownStatus('快照：配置有误', stamp + ' · ' + d.configError);
    $('statusDot').className = 'dot off';
    return;
  }
  $('statusDot').className = d.running ? 'dot on' : 'dot off';
  $('statusText').textContent = d.running ? '快照：运行中' : '快照：已停止';
  var pid = d.running && /^[1-9][0-9]*$/.test(d.pid) ? 'PID ' + d.pid + ' · ' : '';
  $('barSub').textContent = pid + stamp + (d.configWarning ? ' · ' + d.configWarning : '');
  addresses(apiAddress(d.apiUrl), d.lanOpen === true && apiAddress(d.lanApiUrl),
    d.running && panelAddress(d.webUrl));
  $('tipApi').textContent = d.lanOpen === true
    ? 'API 配置含非回环目标，不表示已对外开放；运行态见自检。'
    : 'API 地址是配置候选；运行态见自检，Key 请在本体管理界面管理。';
}

/* 仅对可见标签轮询。XHR 的 timeout/abort 覆盖整个响应体，无须宿主提供 AbortController。
 * 取消时先撤销请求身份；离开标签/宿主后到达的成功、失败和 abort 都不得改写新界面。 */
var request = null, pollTimer = 0;
function stopPoll() {
  clearTimeout(pollTimer);
  var old = request;
  request = null;
  if (old) old.abort();
}
function poll() {
  if (!visible() || request) return;
  var home = page === 'page-home';
  var xhr = null;
  function finish(ok) {
    if (request !== xhr) return;
    request = null;
    if (!visible()) return;
    if (ok) {
      try {
        if (home) render(JSON.parse(xhr.responseText));
        else $('log').textContent = xhr.responseText.trim() || '（暂无日志）';
      } catch (e) { ok = false; }
    }
    if (!ok) {
      if (home) unknownStatus('状态快照读取失败', '当前状态未知，将自动重试。');
      else $('log').textContent = '（无法读取日志快照，将自动重试）';
    }
    pollTimer = setTimeout(poll, 5000);
  }
  try {
    xhr = new XMLHttpRequest();
    request = xhr;
    xhr.onload = function () {
      // 部分静态 file: 宿主成功时没有 HTTP 状态码。只在 load 且读到了正文时接受。
      finish((xhr.status >= 200 && xhr.status < 300) ||
        (location.protocol === 'file:' && xhr.status === 0 && !!xhr.responseText));
    };
    xhr.onerror = xhr.ontimeout = xhr.onabort = function () { finish(false); };
    xhr.open('GET', (home ? 'status.json' : 'lastlog.txt') + '?t=' + Date.now(), true);
    if (/^https?:$/.test(location.protocol)) xhr.setRequestHeader('Cache-Control', 'no-store');
    xhr.timeout = 8000;
    xhr.send();
  } catch (e) { finish(false); }
}
function refreshView() {
  stopPoll();
  if (page === 'page-home') unknownStatus('等待读取快照');
  else $('log').textContent = '等待读取日志快照…';
  if (visible()) poll();
}

/* ---------- 复制：仅用户点按的、当前仍展示的无凭据地址 ---------- */
function copy(btn) {
  var el = $(btn.getAttribute('data-copy')), text = el.textContent, serial = ++copySerial;
  function current() {
    return serial === copySerial && visible() && page === 'page-home' && !btn.disabled && el.textContent === text;
  }
  if (!current()) return;
  function fallback() {
    if (!current()) return;
    var ta = document.createElement('textarea'), ok = false;
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta);
    try { ta.select(); ok = document.execCommand('copy'); } catch (e) { /* 不伪报成功 */ }
    document.body.removeChild(ta);
    toast(ok ? '已复制' : '复制失败，请长按选择');
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { if (current()) toast('已复制'); }, fallback);
      return;
    }
  } catch (e) { /* 一些宿主会同步拒绝访问剪贴板 */ }
  fallback();
}
var copyBtns = document.querySelectorAll('[data-copy]');
for (var i = 0; i < copyBtns.length; i++) {
  copyBtns[i].addEventListener('click', function () { copy(this); });
}

/* ---------- P1：每次进入都向控制器现取；带密码的结果仅用于这一次同窗口跳转 ---------- */
var P1_CMD = 'sh /data/adb/modules/magpie/scripts/magpie.service webui-url';
var attempt = null, serial = 0, autoTried = false;
function hasBridge() { return typeof ksu !== 'undefined' && ksu && typeof ksu.exec === 'function'; }
function updateOpenButton() {
  var b = $('btnOpen'), supported = hasBridge();
  b.disabled = !supported || !!attempt;
  b.textContent = attempt ? '正在核验本体面板…' : supported ? '核验并进入本体面板' : '当前宿主不支持直接进入';
}
function cancelP1() {
  if (!attempt) return;
  clearTimeout(attempt.timer);
  delete window[attempt.name];
  attempt = null;
  updateOpenButton();
}
function openP1(auto) {
  if (attempt || !visible() || page !== 'page-home') return;
  if (!hasBridge()) { updateOpenButton(); return; }
  var a = {name: 'magpieP1_' + Date.now() + '_' + (++serial), auto: auto};
  attempt = a;
  updateOpenButton();
  function fail() {
    if (attempt !== a) return;
    cancelP1();
    if (!auto && visible()) toast('未能核验或打开本体面板，可重试');
  }
  window[a.name] = function (code, out) {
    if (attempt !== a) return;
    if (!visible() || (auto && location.hash === '#status')) { cancelP1(); return; }
    var u = typeof out === 'string' ? out.replace(/\r?\n$/, '') : '';
    var parts = u.split('?k=');
    if (code === 0 && parts.length === 2 && panelAddress(parts[0]) && /^[A-Za-z0-9_-]+$/.test(parts[1])) {
      try { location.replace(u); cancelP1(); return; } catch (e) { /* 无法跳转，仍留在 P2 */ }
    }
    fail();
  };
  a.timer = setTimeout(fail, 10000);
  try {
    var result = ksu.exec(P1_CMD, '{}', a.name);
    // 原生契约以命名回调为准；若宿主还返回 Promise，接住拒绝，但不从它取登录链接。
    if (result && typeof result.then === 'function') result.then(null, fail);
  } catch (e) { fail(); }
}
$('btnOpen').addEventListener('click', function () { openP1(false); });

var navBtns = document.querySelectorAll('.nav-i');
for (var j = 0; j < navBtns.length; j++) {
  navBtns[j].addEventListener('click', function () {
    var next = this.getAttribute('data-page');
    if (page === next) return;
    cancelP1();
    $(page).classList.remove('active');
    page = next;
    $(page).classList.add('active');
    for (var k = 0; k < navBtns.length; k++) navBtns[k].classList.toggle('on', navBtns[k] === this);
    refreshView();
    window.scrollTo(0, 0);
  });
}
var wasVisible = null;
function activation() {
  var on = visible();
  if (on === wasVisible) return; // pageshow 与 visibilitychange 可能指向同一次恢复
  wasVisible = on;
  if (!on) cancelP1();
  updateOpenButton();
  if (on && !autoTried) {
    autoTried = true;
    if (location.hash !== '#status') openP1(true);
  }
  refreshView();
}
document.addEventListener('visibilitychange', activation);
window.addEventListener('pagehide', function () { away = true; activation(); });
window.addEventListener('pageshow', function () { if (away) { away = false; activation(); } });
window.addEventListener('hashchange', function () {
  if (location.hash === '#status' && attempt && attempt.auto) cancelP1();
});
activation();
})();
</script>
</body>
</html>
