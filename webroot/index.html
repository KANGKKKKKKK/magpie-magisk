<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f3f5">
<title>Magpie</title>
<style>
  :root {
    --bg: #f2f3f5;
    --card: #ffffff;
    --text: #18191b;
    --muted: #8b8f96;
    --line: #e5e7ea;
    --accent: #2f6fed;
    --ok: #12b76a;
    --err: #f04438;
    --nav-h: 56px;
    --mono: ui-monospace, "Roboto Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1012;
      --card: #1a1c1f;
      --text: #eceef1;
      --muted: #8b9098;
      --line: #2a2d32;
      --accent: #5b91ff;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: 600px;
    margin-inline: auto;
    overflow-x: hidden;
  }

  /* ---------- 页面容器 ---------- */
  .page {
    display: none;
    padding: 10px 10px 10px;
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
  }
  .page.active { display: block; }

  /* ---------- 顶部状态条 ---------- */
  .bar {
    display: flex; align-items: center; gap: 8px;
    padding: 11px 13px; margin-bottom: 9px;
    background: var(--card); border-radius: 12px;
    border: 1px solid var(--line);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); flex: 0 0 auto;
  }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 16%, transparent); }
  .dot.off { background: var(--err); box-shadow: 0 0 0 3px color-mix(in srgb, var(--err) 14%, transparent); }
  .bar-t { font-weight: 600; font-size: 14px; }
  .bar-s { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---------- 卡片 ---------- */
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; margin-bottom: 9px; overflow: hidden;
  }
  .card-h {
    display: flex; align-items: center; gap: 7px;
    padding: 11px 13px 9px; font-size: 12px; font-weight: 700;
    color: var(--muted); letter-spacing: .02em;
  }
  .dotmark {
    width: 6px; height: 6px; border-radius: 2px; flex: 0 0 auto;
    background: var(--accent);
  }
  .dotmark.b { background: #8b5cf6; }

  /* ---------- 字段 ---------- */
  .f {
    padding: 9px 13px; border-top: 1px solid var(--line);
    min-width: 0;
  }
  .f-k {
    font-size: 11px; color: var(--muted);
    margin-bottom: 4px;
  }
  /* 地址独占一行, 按钮在下一行靠右 —— 永远不会互相挤压 */
  .f-v {
    display: block;
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    min-width: 0;
    font: 12px/1.45 var(--mono);
    color: var(--text);
    word-break: break-all;
    overflow-wrap: anywhere;
    -webkit-user-select: text; user-select: text;
  }
  .f-act {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-start;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    width: 100%;
  }
  .f-v.masked { color: var(--muted); font-family: inherit; letter-spacing: .05em; }

  /* ---------- 图标按钮 ---------- */
  .ic {
    flex: 0 0 auto;
    width: 34px; height: 34px;
    min-width: 34px; min-height: 34px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 0; background: transparent; border-radius: 8px;
    color: var(--accent);
    font-size: 0; line-height: 0;
    cursor: pointer; padding: 0;
    transition: background .15s, color .15s, transform .08s;
  }
  /* 用 flex 居中, 不依赖 svg */
  .ic > span { display: block; }
  .ic:active { transform: scale(.9); }
  .ic.ok { color: var(--ok); }

  /* 文字按钮 (最可靠) */
  .ic.txt {
    width: auto !important;
    min-width: 56px !important;
    height: 32px; min-height: 32px;
    padding: 0 12px;
    font-size: 12px !important;
    line-height: 30px;
    font-weight: 600; font-family: inherit;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--accent) !important;
    border-radius: 8px;
    display: inline-block !important;
  }
  .ic.txt:active { transform: scale(.96); opacity: .75; }
  .ic.txt.ok { color: var(--ok) !important; border-color: var(--ok); }

  /* 底部导航图标 */
  .ni {
    display: block; position: relative;
    width: 20px; height: 20px;
  }
  .ni-home::before {
    content: ""; position: absolute;
    left: 1px; top: 9px; width: 18px; height: 10px;
    border: 2px solid currentColor; border-top: 0;
    border-radius: 0 0 2px 2px;
  }
  .ni-home::after {
    content: ""; position: absolute;
    left: 4px; top: 3px; width: 12px; height: 12px;
    border-left: 2px solid currentColor;
    border-top: 2px solid currentColor;
    transform: rotate(45deg);
    background: transparent;
  }
  .ni-log::before {
    content: ""; position: absolute;
    left: 3px; top: 2px; width: 12px; height: 16px;
    border: 2px solid currentColor; border-radius: 2px;
  }
  .ni-log::after {
    content: ""; position: absolute;
    left: 6px; top: 7px; width: 8px; height: 1.8px;
    background: currentColor;
    box-shadow: 0 4px 0 currentColor;
  }

  /* ---------- 主按钮 ---------- */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin: 10px 13px 12px;
    padding: 12px;
    background: var(--accent); color: #fff;
    border-radius: 10px;
    font-size: 14px; font-weight: 600; text-decoration: none;
    transition: opacity .15s, transform .08s;
  }
  .btn:active { transform: scale(.98); opacity: .82; }
  .btn.disabled { background: var(--muted); pointer-events: none; opacity: .45; }

  .tip { padding: 0 13px 12px; font-size: 11px; line-height: 1.55; color: var(--muted); }

  /* ---------- 日志 ---------- */
  pre#log {
    margin: 0; padding: 11px 13px 13px;
    font: 11px/1.5 var(--mono);
    color: var(--muted);
    max-height: 60vh; overflow: auto;
    white-space: pre-wrap; word-break: break-all;
  }

  /* ---------- 底部导航 ---------- */
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; height: var(--nav-h);
    background: var(--card);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
    max-width: 600px; margin-inline: auto;
    z-index: 50;
  }
  .nav-i {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
    border: 0; background: transparent; cursor: pointer;
    color: var(--muted); font: inherit; font-size: 11px;
    padding: 0; transition: color .15s;
  }
  .nav-i svg { display: block; }
  .nav-i.on { color: var(--accent); font-weight: 600; }

  /* 给底部导航留空间 */
  .pages { padding-bottom: calc(var(--nav-h) + 8px + env(safe-area-inset-bottom)); }

  /* ---------- toast ---------- */
  #toast {
    position: fixed; left: 50%; bottom: calc(var(--nav-h) + 20px);
    transform: translateX(-50%) translateY(10px);
    background: #24262b; color: #fff;
    padding: 9px 15px; border-radius: 9px;
    font-size: 13px; max-width: 86vw; text-align: center;
    opacity: 0; pointer-events: none;
    transition: opacity .18s, transform .18s;
    z-index: 99;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="pages">

  <!-- ========== 页面 1: 首页 ========== -->
  <div class="page active" id="page-home">
    <div class="bar">
      <span class="dot" id="statusDot"></span>
      <span class="bar-t" id="statusText">检测中</span>
      <span class="bar-s" id="barSub"></span>
    </div>

    <div class="card">
      <div class="card-h"><span class="dotmark a"></span>API 接入</div>

      <div class="f">
        <div class="f-k">接口地址（配置候选）</div>
        <div class="f-v" id="vApiUrl">—</div>
        <div class="f-act"><button class="ic txt" data-copy="vApiUrl" title="复制">复制</button>
        </div>
      </div>

      <div class="f">
        <div class="f-k">API Key</div>
        <div class="f-v masked" id="vApiKey">密钥不通过状态快照暴露；请在本体管理界面管理</div>
      </div>

      <div class="f" id="fLanApi" style="display:none">
        <div class="f-k">局域网地址（配置候选）</div>
        <div class="f-v" id="vLanApi">—</div>
        <div class="f-act"><button class="ic txt" data-copy="vLanApi" title="复制">复制</button>
        </div>
      </div>

      <div class="tip" id="tipApi"></div>
    </div>

    <div class="card">
      <div class="card-h"><span class="dotmark b"></span>控制台</div>

      <div class="f">
        <div class="f-k">最近核验的回环地址</div>
        <div class="f-v" id="vWebUrl">—</div>
        <div class="f-act"><button class="ic txt" id="copyWebUrl" data-copy="vWebUrl" title="复制" disabled>复制</button>
        </div>
      </div>

      <div class="f">
        <div class="f-k">访问密码</div>
        <div class="f-v masked" id="vWebKey">访问密码不通过状态快照提供</div>
      </div>

      <span class="btn disabled" id="btnOpen" aria-disabled="true">请在外部浏览器手动打开</span>
      <div class="tip">此页不跳转、不提供密码；只在确认目标是本机面板后于普通浏览器访问。</div>
    </div>
  </div>

  <!-- ========== 页面 2: 日志 ========== -->
  <div class="page" id="page-log">
    <div class="card" style="margin-bottom:0">
      <div class="card-h"><span class="dotmark c"></span>运行日志（最近 30 行）</div>
      <pre id="log">加载中…</pre>
    </div>
  </div>

</div>

<!-- 底部导航 -->
<div class="nav">
  <button class="nav-i on" data-page="page-home">
    <span class="ni ni-home"></span>首页
  </button>
  <button class="nav-i" data-page="page-log">
    <span class="ni ni-log"></span>日志
  </button>
</div>

<div id="toast"></div>
<script>
// 纯静态: 数据来自同目录 status.json (由 scripts/status.sh 生成)

function $(id) { return document.getElementById(id); }

function setText(id, val) {
  var el = $(id);
  if (el) el.textContent = (val === undefined || val === null || val === '') ? '—' : val;
}

function toast(msg) {
  var el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(function () { el.classList.remove('show'); }, 1600);
}

/* ---------- 页面切换 ---------- */
var navBtns = document.querySelectorAll('.nav-i');
for (var i = 0; i < navBtns.length; i++) {
  navBtns[i].addEventListener('click', function () {
    var target = this.getAttribute('data-page');
    var pages = document.querySelectorAll('.page');
    for (var j = 0; j < pages.length; j++) pages[j].classList.remove('active');
    for (var k = 0; k < navBtns.length; k++) navBtns[k].classList.remove('on');
    $(target).classList.add('active');
    this.classList.add('on');
    window.scrollTo(0, 0);
  });
}

/* ---------- 复制 ---------- */
function copyText(text) {
  if (!text || text === '—') { toast('没有可复制内容'); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text)
      .then(function () { toast('已复制'); })
      .catch(function () { fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('已复制'); }
  catch (e) { toast('复制失败，请长按选择'); }
  document.body.removeChild(ta);
}

document.addEventListener('click', function (e) {
  var t = e.target;
  while (t && t !== document.body) {
    if (t.classList && t.classList.contains('ic') && t.hasAttribute('data-copy')) break;
    t = t.parentNode;
  }
  if (!t || t === document.body) return;

  var el = $(t.getAttribute('data-copy'));
  copyText(el ? (el.textContent || '') : '');
  t.classList.add('ok');
  setTimeout(function () { t.classList.remove('ok'); }, 1200);
});

/* ---------- 数据加载 ---------- */
var loading = false;
function loadStatus() {
  // 页面不可见时不轮询；上一轮还没回来时不叠加请求。
  if (loading || document.hidden) return;
  loading = true;
  fetch('status.json?t=' + Date.now())
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(render)
    .catch(function (e) {
      $('statusText').textContent = '读取失败';
      $('statusDot').className = 'dot';
      setText('vWebUrl', '');
      $('copyWebUrl').disabled = true;
      $('btnOpen').textContent = '无法核验面板地址';
      $('log').textContent = '无法读取 status.json：' + e.message;
    })
    .then(function () { loading = false; });
}

function render(d) {
  var running = !!d.running;

  $('statusDot').className = 'dot ' + (running ? 'on' : 'off');
  $('statusText').textContent = running ? '运行中' : '已停止';
  // 数据是事件驱动写出来的快照，不是实时监控：把写入时刻直接标出来，
  // 免得看到数字不动以为卡住了
  var sub = running ? ('PID ' + d.pid) : '';
  if (d.updated) sub += (sub ? ' · ' : '') + '数据 ' + d.updated;
  $('barSub').textContent = sub;
  // 监听地址配错时 status.sh 会给出 configError，此时地址字段是空的
  if (d.configError) {
    $('statusText').textContent = '配置有误';
    $('statusDot').className = 'dot off';
    $('barSub').textContent = d.configError;
  } else if (d.configWarning) {
    $('barSub').textContent = sub + ' · ' + d.configWarning;
  }

  // 首页
  setText('vApiUrl', d.apiUrl);
  setText('vLanApi', d.lanApiUrl);

  $('fLanApi').style.display = (d.lanOpen && d.lanApiUrl) ? '' : 'none';
  $('tipApi').textContent = d.lanOpen
    ? 'API 配置含非回环目标，不表示已对外开放；运行态见自检。'
    : 'API 配置目标为仅本机，运行态见自检；Key 请在本体管理界面管理。';

  var webAddress = running && !d.configError ? d.webUrl : '';
  setText('vWebUrl', webAddress);
  $('copyWebUrl').disabled = !webAddress;
  // This WebView may expose a privileged native bridge. Never navigate it to
  // the gateway panel or attach its long-lived password to a URL. The address
  // above is for the user to open manually in a separate, ordinary browser.
  var b1 = $('btnOpen');
  b1.textContent = webAddress
    ? '可复制上方地址，在外部浏览器手动打开'
    : '未核验本机面板监听，地址不可用';

  loadLog();
}

function loadLog() {
  fetch('lastlog.txt?t=' + Date.now())
    .then(function (r) { return r.ok ? r.text() : Promise.reject('HTTP ' + r.status); })
    .then(function (t) { $('log').textContent = t.trim() || '（暂无日志）'; })
    .catch(function () { $('log').textContent = '（无法读取日志）'; });
}

/* ---------- KernelSU WebUI：进入本体面板（P1） ----------
 * 宿主提供 ksu.exec 时，向控制器要一次「已核验回环地址 + 访问密码」的登录链接，
 * 在同一 WebView 里打开 P1。密码只经 root 命令的 stdout 返回，不写入 status.json、
 * lastlog.txt 或日志。拿不到（服务未运行、监听未核验、宿主不支持）就留在本页（P2）。
 * 地址带 #status 时强制停留在状态页。 */
var P1_CMD = 'sh /data/adb/modules/magpie/scripts/magpie.service webui-url';
function openP1(silent) {
  if (typeof ksu === 'undefined' || !ksu || typeof ksu.exec !== 'function') return false;
  var cb = 'magpieP1_' + Date.now();
  window[cb] = function (code, out) {
    delete window[cb];
    var u = String(out || '').trim();
    if (code === 0 && /^http:\/\/(127\.0\.0\.1|\[::1\]):[0-9]+\/\?k=[A-Za-z0-9_-]+$/.test(u)) {
      location.replace(u);
    } else if (!silent) {
      toast('未能核验本体面板，留在状态页');
    }
  };
  try { ksu.exec(P1_CMD, '{}', cb); return true; } catch (e) { delete window[cb]; return false; }
}
if (location.hash !== '#status') openP1(true);
if (typeof ksu !== 'undefined' && ksu && typeof ksu.exec === 'function') {
  var bo = $('btnOpen');
  bo.className = 'btn'; bo.removeAttribute('aria-disabled'); bo.textContent = '进入本体面板';
  bo.addEventListener('click', function () { openP1(false); });
}

loadStatus();
setInterval(loadStatus, 5000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) loadStatus(); });
</script>
</body>
</html>
