name: ci

# 每次推到 main 或提 PR 都跑：语法检查 + 全部测试套件。
# 发布工作流也跑同一套，这里提前拦住问题。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 语法检查
        run: |
          set -eu
          for f in service.sh action.sh uninstall.sh customize.sh scripts/magpie.service scripts/*.sh tests/*.sh; do
            sh -n "$f"
          done
          echo "语法检查通过"

      - name: shellcheck
        run: |
          set -eu
          # 只查生产脚本。测试文件里大量 `a && b || c` 是刻意写法，
          # 查出来全是风格噪音（70 条里 59 条来自 tests/）。
          # SC1090/SC1091：动态 source（先判断 lib.sh 在不在），刻意如此。
          # 单处例外用内联 `# shellcheck disable=` 标注并写理由，
          # 这样能保证例外是「解释过的」，不是「整体关掉」。
          shellcheck -s sh -e SC1090,SC1091 \
            service.sh action.sh uninstall.sh customize.sh scripts/magpie.service scripts/*.sh

      - name: 文档里的测试数字是否与实际一致
        run: |
          set -eu
          # 断言数散落在 README / README_EN / tests/README / CHANGELOG 四处，
          # 手改容易漏（已经出现过 222 vs 232 vs 286）。这一步直接跑测试数一遍。
          sh tests/check-counts.sh

      - name: 磁贴的状态判定逻辑
        run: |
          set -eu
          # 纯 JVM，不依赖 Android SDK。这两段逻辑决定磁贴和自查显示什么，
          # 判错会让「启动失败」看起来像「已停止」。
          W=$(mktemp -d)
          javac -encoding UTF-8 tests/jvm/ClassifyTest.java -d "$W"
          # -encoding 只影响「读源码」；控制台输出取决于 file/stdout.encoding。
          # 用例里有中文（"正在停止"），GBK/ASCII 环境下会变成问号，排查时更难看。
          java -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -cp "$W" ClassifyTest

          # 自查结论。SelfCheck 不引 Android 类，能直接编进来。
          W2=$(mktemp -d)
          javac -encoding UTF-8 tile-app/src/com/ruin/magpie/tile/SelfCheck.java \
            tests/jvm/SelfCheckTest.java -d "$W2"
          java -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -cp "$W2" \
            com.ruin.magpie.tile.SelfCheckTest

          # Shell 进程执行：用两个最小 android.os 桩，在桌面 JVM 跑真实 Process。
          W3=$(mktemp -d)
          mkdir -p "$W3/stubs/android/os" "$W3/classes"
          cat > "$W3/stubs/android/os/Looper.java" <<'JAVA'
          package android.os; public class Looper { public static Looper getMainLooper() { return new Looper(); } }
          JAVA
          cat > "$W3/stubs/android/os/Handler.java" <<'JAVA'
          package android.os; public class Handler { public Handler(Looper l) {} public boolean post(Runnable r) { r.run(); return true; } }
          JAVA
          javac -encoding UTF-8 -d "$W3/classes" "$W3"/stubs/android/os/*.java \
            tile-app/src/com/ruin/magpie/tile/Shell.java tests/jvm/ShellTest.java
          java -cp "$W3/classes" com.ruin.magpie.tile.ShellTest

      - name: 磁贴 App 能编译
        run: |
          set -eu
          # 不需要签名密钥，只验证源码与资源能过编译。
          # 用了 android-34 的 android.jar：android-37.0 那种 preview 平台
          # 没有完整属性表，会让 aapt 报一堆 No resource identifier。
          if ! command -v aapt >/dev/null 2>&1; then
            echo "安装 aapt"
            sudo apt-get update -qq
            sudo apt-get install -y -qq aapt
          fi
          JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          if [ ! -f "$JAR" ]; then
            echo "安装 android-34 平台"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-34" >/dev/null 2>&1 || true
          fi
          if [ ! -f "$JAR" ]; then
            # 装不上时不要误报失败：这一步是加分项，不是发布门槛
            # （release.yml 打包前会真正构建一次）。
            echo "::warning::拿不到 android-34，跳过编译检查"
            exit 0
          fi
          W=$(mktemp -d)
          # aapt -J 不会自己创建目标目录，缺了会报
          # "Unable to open class file .../gen/.../R.java" —— 而它的退出码
          # 还是 0，光看 $? 发现不了。
          mkdir -p "$W/gen" "$W/classes"
          aapt package -f -m -J "$W/gen" -M tile-app/AndroidManifest.xml \
            -S tile-app/res -I "$JAR"
          # 源码注释是中文，不指定编码时平台默认非 UTF-8 就会一片
          # "unmappable character"。
          # 这里不用 `javac ... | grep ...`：管道会让 $? 变成 grep 的退出码，
          # 编译失败会被当成成功。先落文件、查退出码、再过滤。
          javac -encoding UTF-8 -source 8 -target 8 -bootclasspath "$JAR" \
            -d "$W/classes" \
            $(find tile-app/src "$W/gen" -name '*.java') > "$W/javac.log" 2>&1
          _rc=$?
          grep -vE 'bootstrap class path|source value 8|target value 8|obsolete|Xlint' \
            "$W/javac.log" || true
          if [ "$_rc" -ne 0 ]; then
            echo "::error::磁贴 App 编译失败"
            exit 1
          fi
          # 清单声明的两个组件都必须在，防止「只编出一个类」的假绿
          for c in MagpieTileService MainActivity LauncherIcon Shell; do
            if [ ! -f "$W/classes/com/ruin/magpie/tile/$c.class" ]; then
              echo "::error::缺少编译产物 $c.class"
              exit 1
            fi
          done
          echo "磁贴 App 编译通过"

      - name: 测试
        run: |
          set -eu
          python3 tests/make-fixtures.py /tmp/fx
          ( cd /tmp/fx && exec python3 -m http.server 8899 --bind 127.0.0.1 ) &
          SRV_PID=$!
          trap 'kill "$SRV_PID" 2>/dev/null || true' EXIT
          sleep 1

          TEST_SRV=http://127.0.0.1:8899 sh tests/test-install.sh
          sh tests/test-watchdog.sh
          TEST_SRV=http://127.0.0.1:8899 sh tests/test-action.sh
          sh tests/test-service.sh
          sh tests/test-lib.sh
