name: ci

# 每次推到 main 或提 PR 都跑：语法检查 + 全部测试套件。
# 发布工作流跑同一份（tests/run-all.sh），两边永不漂移。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 与 release.yml 固定同一镜像，避免 latest 滚动时两边工具链不一致。
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 检出
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24，固定 SHA
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 校验工作流与 Issue 表单的 YAML 语法
        run: ruby -rpsych -e 'ARGV.each { |f| Psych.parse_file(f) || abort(f) }' .github/workflows/*.yml .github/ISSUE_TEMPLATE/*.yml

      - name: 磁贴运行时变更必须递增 versionCode
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            [ -n "$PR_BASE_SHA" ] || { echo '::error::拿不到可信 PR 基线'; exit 1; }
            python3 scripts/ci/check-tile-version.py --base-ref "$PR_BASE_SHA"
          else
            python3 scripts/ci/check-tile-version.py
          fi

      - name: 安装测试和 Android 构建工具
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt apksigner zipalign shellcheck curl openssl
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;35.0.0'

      - name: 更新索引 PR 不允许降级
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          python3 -I - "$BASE_SHA" <<'PY'
          import json, pathlib, subprocess, sys
          previous = json.loads(subprocess.check_output(['git', 'show', sys.argv[1] + ':update.json']))
          current = json.loads(pathlib.Path('update.json').read_text())
          if current == previous:
              sys.exit(0)
          old = previous['versionCode']
          new = current['versionCode']
          if type(old) is not int or type(new) is not int or not old < new <= 2147483647:
              raise SystemExit('update.json 变更必须递增 versionCode（请在最新 main 上重新核对）')
          PY

      - name: 全部公共测试（与 Release 共用）
        run: sh tests/run-all.sh

      - name: 使用临时证书实际构建 APK、打包并核对清单
        run: |
          set -eu
          umask 077
          W=$(mktemp -d)
          trap 'rm -rf "$W"' EXIT
          MAGPIE_KEYSTORE="$W/test-only.p12"
          MAGPIE_KS_PASS=$(openssl rand -hex 20)
          export MAGPIE_KEYSTORE MAGPIE_KS_PASS
          keytool -genkeypair -storetype PKCS12 -keystore "$MAGPIE_KEYSTORE" -alias magpie \
            -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Disposable CI verification' \
            -storepass:env MAGPIE_KS_PASS -keypass:env MAGPIE_KS_PASS >/dev/null 2>&1
          MAGPIE_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0" sh build.sh "$W/dist"
          V=$(sed -n 's/^version=//p' module.prop)
          ZIP="$W/dist/magpie-$V.zip"
          python3 -I scripts/ci/release-artifacts.py verify --source "$PWD" --file "$ZIP" --tag "$V"
          unzip -p "$ZIP" magpie-tile.apk > "$W/tile.apk"
          apksigner verify --print-certs "$W/tile.apk" > "$W/cert-details"
          sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$W/cert-details" > "$W/test-cert.txt"
          EXPECTED_CERT_FILE="$W/test-cert.txt" sh scripts/ci/verify-release-zip.sh "$ZIP" "$V"
          zipalign -c 4 "$W/tile.apk"

          # 本地没有密钥时会走「复用 APK」分支。同一测试证书必须能复用；
          # 用仓库正式指纹检查测试证书则必须拒绝，已有 ZIP 不能被覆写。
          unset MAGPIE_KEYSTORE MAGPIE_KS_PASS
          cp "$W/tile.apk" magpie-tile.apk
          EXPECTED_CERT_FILE="$W/test-cert.txt" sh build.sh "$W/repacked"
          cmp "$ZIP" "$W/repacked/magpie-$V.zip"
          printf 'previous output\n' > "$W/repacked/magpie-$V.zip"
          if sh build.sh "$W/repacked"; then echo 'unexpected signer accepted' >&2; exit 1; fi
          grep -qx 'previous output' "$W/repacked/magpie-$V.zip"
