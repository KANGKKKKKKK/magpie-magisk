name: ci

# 每次推到 main 或提 PR 都跑：语法检查 + 全部测试套件。
# 发布工作流也跑同一套，这里提前拦住问题。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 语法检查
        run: |
          set -eu
          for f in service.sh action.sh uninstall.sh customize.sh scripts/*.sh tests/*.sh; do
            sh -n "$f"
          done
          echo "语法检查通过"

      - name: shellcheck
        run: |
          set -eu
          # 只查生产脚本。测试文件里大量 `a && b || c` 是刻意写法，
          # 查出来全是风格噪音（70 条里 59 条来自 tests/）。
          # SC1090/SC1091：动态 source（先判断 lib.sh 在不在），刻意如此。
          # 单处例外用内联 `# shellcheck disable=` 标注并写理由，
          # 这样能保证例外是「解释过的」，不是「整体关掉」。
          shellcheck -s sh -e SC1090,SC1091 \
            service.sh action.sh uninstall.sh customize.sh scripts/*.sh

      - name: 磁贴 App 能编译
        run: |
          set -eu
          # 不需要签名密钥，只验证源码与资源能过编译。
          # 用了 android-34 的 android.jar：android-37.0 那种 preview 平台
          # 没有完整属性表，会让 aapt 报一堆 No resource identifier。
          if ! command -v aapt >/dev/null 2>&1; then
            echo "安装 aapt"
            sudo apt-get update -qq
            sudo apt-get install -y -qq aapt
          fi
          JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          if [ ! -f "$JAR" ]; then
            echo "安装 android-34 平台"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-34" >/dev/null 2>&1 || true
          fi
          if [ ! -f "$JAR" ]; then
            # 装不上时不要误报失败：这一步是加分项，不是发布门槛
            # （release.yml 打包前会真正构建一次）。
            echo "::warning::拿不到 android-34，跳过编译检查"
            exit 0
          fi
          W=$(mktemp -d)
          aapt package -f -m -J "$W/gen" -M tile-app/AndroidManifest.xml \
            -S tile-app/res -I "$JAR"
          javac -source 8 -target 8 -bootclasspath "$JAR" -d "$W/classes" \
            $(find tile-app/src "$W/gen" -name '*.java') 2>&1 \
            | grep -vE 'bootstrap class path|source value 8|target value 8|obsolete|Xlint' || true
          test -f "$W/classes/com/ruin/magpie/tile/MagpieTileService.class"
          echo "磁贴 App 编译通过"

      - name: 测试
        run: |
          set -eu
          python3 tests/make-fixtures.py /tmp/fx
          ( cd /tmp/fx && exec python3 -m http.server 8899 --bind 127.0.0.1 ) &
          SRV_PID=$!
          trap 'kill "$SRV_PID" 2>/dev/null || true' EXIT
          sleep 1

          TEST_SRV=http://127.0.0.1:8899 sh tests/test-install.sh
          sh tests/test-watchdog.sh
          TEST_SRV=http://127.0.0.1:8899 sh tests/test-action.sh
          sh tests/test-service.sh
          sh tests/test-lib.sh
