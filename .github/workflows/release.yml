name: release

on:
  push:
    tags: ['v*', '!v*-*']  # suffix tags are explicit prerelease dispatches only
  workflow_dispatch:
    inputs:
      mode:
        description: 'build: 在目标 tag 运行；finalize/recover: 从 main 核对已有产物'
        type: choice
        options: [build, finalize, recover]
        default: build
      tag:
        description: 'finalize/recover 必填；build 留空或与触发 tag 一致'
        type: string
        required: false
      prerelease:
        description: '仅 build：创建预发布草稿，不更新管理器通道'
        type: boolean
        default: false
      sync_update_json:
        description: '正式包验证后创建更新通道 PR（不直接推 main）'
        type: boolean
        default: true

permissions: {}
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
      tag_object: ${{ steps.meta.outputs.tag_object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 核对触发 ref、annotated tag 与目标提交的 main CI
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode || 'build' }}
          TARGET_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease || false }}
        run: sh scripts/ci/release-flow.sh plan

  build:
    needs: plan
    if: ${{ github.event_name == 'push' || inputs.mode == 'build' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: 安装构建环境（没有正式密钥或发布权限）
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck aapt zipalign
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;35.0.0'
      - name: 公共测试与未签名 APK
        run: |
          set -eu
          sh tests/run-all.sh
          MAGPIE_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0" sh tile-app/build.sh --unsigned "$RUNNER_TEMP/unsigned"
      - name: 只交接未签名 APK
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: magpie-unsigned-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unsigned/magpie-tile-unsigned.apk
          if-no-files-found: error
          retention-days: 35

  sign:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: magpie-signing
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      TARGET_TAG: ${{ needs.plan.outputs.tag }}
      EXPECTED_COMMIT: ${{ needs.plan.outputs.commit }}
      EXPECTED_TAG_OBJECT: ${{ needs.plan.outputs.tag_object }}
      POLICY_SHA: ${{ vars.MAGPIE_RELEASE_POLICY_SHA }}
    steps:
      - name: 检查 Environment 策略版本已配置
        run: printf '%s' "$POLICY_SHA" | grep -Ex '[0-9a-f]{40}' >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.MAGPIE_RELEASE_POLICY_SHA }}
          path: policy
          fetch-depth: 0
          persist-credentials: false
      - name: 安装签名校验工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt apksigner zipalign
      - name: 按 ID 和摘要取回构建产物
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          OUT_DIR: ${{ runner.temp }}/unsigned-input
        run: sh policy/scripts/ci/release-flow.sh fetch-unsigned
      - name: 使用既有正式证书签 APK，以审核过的策略打包
        env:
          MAGPIE_KEYSTORE_B64: ${{ secrets.MAGPIE_KEYSTORE_B64 }}
          MAGPIE_KS_PASS: ${{ secrets.MAGPIE_KS_PASS }}
          IN_DIR: ${{ runner.temp }}/unsigned-input
          OUT_DIR: ${{ runner.temp }}/signed
        run: sh policy/scripts/ci/release-flow.sh sign
      - name: 只交接已核验的 ZIP 和校验清单
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: magpie-signed-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/signed/magpie-${{ needs.plan.outputs.tag }}.zip
            ${{ runner.temp }}/signed/SHA256SUMS
          if-no-files-found: error
          retention-days: 35

  publish:
    needs: [plan, sign]
    if: ${{ needs.sign.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: magpie-publish
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    env:
      MODE: build
      TARGET_TAG: ${{ needs.plan.outputs.tag }}
      EXPECTED_COMMIT: ${{ needs.plan.outputs.commit }}
      EXPECTED_TAG_OBJECT: ${{ needs.plan.outputs.tag_object }}
      POLICY_SHA: ${{ vars.MAGPIE_RELEASE_POLICY_SHA }}
    outputs:
      stable: ${{ steps.release.outputs.stable }}
      digest: ${{ steps.release.outputs.digest }}
      release_id: ${{ steps.release.outputs.release_id }}
      code: ${{ steps.release.outputs.code }}
    steps:
      - name: 检查 Environment 策略版本已配置
        run: printf '%s' "$POLICY_SHA" | grep -Ex '[0-9a-f]{40}' >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.MAGPIE_RELEASE_POLICY_SHA }}
          path: policy
          fetch-depth: 0
          persist-credentials: false
      - name: 安装校验工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt apksigner zipalign
      - name: 按 ID 和摘要核对签名阶段输出
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.sign.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.sign.outputs.artifact_digest }}
          OUT_DIR: ${{ runner.temp }}/ready
        run: sh policy/scripts/ci/release-flow.sh fetch-signed
      - name: 只在 tag 运行中为确切的已签名产物生成证明
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/ready/magpie-${{ needs.plan.outputs.tag }}.zip
            ${{ runner.temp }}/ready/SHA256SUMS
      - name: 核对不可变设置、上传验证过的草稿并回读正式资产
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          IN_DIR: ${{ runner.temp }}/ready
          PRERELEASE: ${{ inputs.prerelease || false }}
          PROVENANCE_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          MAGPIE_RELEASE_SETTINGS_TOKEN: ${{ secrets.MAGPIE_RELEASE_SETTINGS_TOKEN }}
        run: sh policy/scripts/ci/release-flow.sh publish

  finalize:
    needs: plan
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'finalize' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    environment: magpie-publish
    permissions:
      actions: read
      contents: write
    env:
      MODE: finalize
      TARGET_TAG: ${{ needs.plan.outputs.tag }}
      EXPECTED_COMMIT: ${{ needs.plan.outputs.commit }}
      EXPECTED_TAG_OBJECT: ${{ needs.plan.outputs.tag_object }}
      POLICY_SHA: ${{ vars.MAGPIE_RELEASE_POLICY_SHA }}
    outputs:
      stable: ${{ steps.release.outputs.stable }}
      digest: ${{ steps.release.outputs.digest }}
      release_id: ${{ steps.release.outputs.release_id }}
      code: ${{ steps.release.outputs.code }}
    steps:
      - name: 检查 Environment 策略版本已配置
        run: printf '%s' "$POLICY_SHA" | grep -Ex '[0-9a-f]{40}' >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.MAGPIE_RELEASE_POLICY_SHA }}
          path: policy
          fetch-depth: 0
          persist-credentials: false
      - name: 安装校验工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt apksigner zipalign
      - name: 只验证已有资产，不重建或生成新的 provenance
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          MAGPIE_RELEASE_SETTINGS_TOKEN: ${{ secrets.MAGPIE_RELEASE_SETTINGS_TOKEN }}
        run: sh policy/scripts/ci/release-flow.sh publish

  recover:
    needs: plan
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'recover' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    environment: magpie-publish
    permissions:
      contents: read
    env:
      MODE: recover
      TARGET_TAG: ${{ needs.plan.outputs.tag }}
      EXPECTED_COMMIT: ${{ needs.plan.outputs.commit }}
      EXPECTED_TAG_OBJECT: ${{ needs.plan.outputs.tag_object }}
      POLICY_SHA: ${{ vars.MAGPIE_RELEASE_POLICY_SHA }}
    outputs:
      stable: ${{ steps.release.outputs.stable }}
      digest: ${{ steps.release.outputs.digest }}
      release_id: ${{ steps.release.outputs.release_id }}
      code: ${{ steps.release.outputs.code }}
    steps:
      - name: 检查 Environment 策略版本已配置
        run: printf '%s' "$POLICY_SHA" | grep -Ex '[0-9a-f]{40}' >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.MAGPIE_RELEASE_POLICY_SHA }}
          path: policy
          fetch-depth: 0
          persist-credentials: false
      - name: 安装校验工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt apksigner zipalign
      - name: 只验证已有资产，不重建或生成新的 provenance
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh policy/scripts/ci/release-flow.sh publish

  update-channel:
    needs: [plan, publish, finalize, recover]
    if: ${{ !cancelled() && (needs.publish.outputs.stable == 'true' || needs.finalize.outputs.stable == 'true' || needs.recover.outputs.stable == 'true') && (github.event_name == 'push' || inputs.sync_update_json || inputs.mode == 'recover') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: magpie-update-channel
    permissions:
      contents: write
      pull-requests: write
    env:
      MODE: ${{ inputs.mode || 'build' }}
      TARGET_TAG: ${{ needs.plan.outputs.tag }}
      EXPECTED_COMMIT: ${{ needs.plan.outputs.commit }}
      EXPECTED_TAG_OBJECT: ${{ needs.plan.outputs.tag_object }}
      POLICY_SHA: ${{ vars.MAGPIE_RELEASE_POLICY_SHA }}
    steps:
      - name: 检查 Environment 策略版本已配置
        run: printf '%s' "$POLICY_SHA" | grep -Ex '[0-9a-f]{40}' >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.MAGPIE_RELEASE_POLICY_SHA }}
          path: policy
          fetch-depth: 0
          persist-credentials: false
      - name: 回读公开不可变发布，只提 PR，不绕过 main 规则
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.publish.outputs.release_id || needs.finalize.outputs.release_id || needs.recover.outputs.release_id }}
          RELEASE_CODE: ${{ needs.publish.outputs.code || needs.finalize.outputs.code || needs.recover.outputs.code }}
          ZIP_DIGEST: ${{ needs.publish.outputs.digest || needs.finalize.outputs.digest || needs.recover.outputs.digest }}
        run: sh policy/scripts/ci/release-flow.sh update-pr
