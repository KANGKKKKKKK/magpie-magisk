name: release

# 推送 v* tag 时自动打包发版；也可以在 Actions 页面手动指定 tag 触发。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（必须已存在，例如 v0.8）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # workflow_dispatch 的输入是任意文本，必须经环境变量传给脚本。
      # 直接写成 ${{ github.event.inputs.tag }} 塞进 run: 等于把用户输入
      # 当 shell 代码执行（命令注入）。
      INPUT_TAG: ${{ github.event.inputs.tag }}
      REPO: ${{ github.repository }}
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 手动指定 tag 时必须检出那个 tag；否则打出来的包是触发时分支的代码
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 读取版本并校验一致性
        id: meta
        run: |
          set -eu
          VER=$(sed -n 's/^version=//p' module.prop | tr -d '\r' | head -1)
          CODE=$(sed -n 's/^versionCode=//p' module.prop | tr -d '\r' | head -1)

          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
            # 只接受 v1.2 / v1.2.3 这种形状的 tag。
            # 校验实现在 scripts/lib.sh：case 的 glob 会把 v1junk.2 也放行
            #（除 . 和 [] 外都是通配符），所以那边改成按段显式检查，
            # 并且由 tests/test-lib.sh 覆盖，改坏了本地就能发现。
            . scripts/lib.sh
            if ! is_valid_release_tag "$TAG"; then
              echo "::error::tag 形状不对：$TAG（应形如 v0.8 或 v0.9.2）"
              exit 1
            fi
          else
            TAG="$GITHUB_REF_NAME"
          fi

          echo "module.prop: version=$VER versionCode=$CODE"
          echo "触发用的 tag: $TAG"

          # tag 和 module.prop 必须对上，否则发出去的包会被管理器判定为旧版本
          if [ "$VER" != "$TAG" ]; then
            echo "::error::tag $TAG 与 module.prop 的 version $VER 不一致，先把 module.prop 改好再打 tag"
            exit 1
          fi

          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 语法检查与测试
        run: |
          set -eu
          for f in service.sh action.sh uninstall.sh customize.sh scripts/*.sh tests/*.sh; do
            sh -n "$f"
          done
          echo "语法检查通过"

          # 只查生产脚本：测试文件里大量 a && b || c 是刻意写法，查出来全是噪音。
          # SC1090/SC1091 是动态 source（先判断 lib.sh 在不在），刻意如此。
          shellcheck -s sh -e SC1090,SC1091 \
            service.sh action.sh uninstall.sh customize.sh scripts/*.sh
          echo "shellcheck 通过"

          python3 tests/make-fixtures.py /tmp/fx
          ( cd /tmp/fx && exec python3 -m http.server 8899 --bind 127.0.0.1 ) &
          SRV_PID=$!
          trap 'kill "$SRV_PID" 2>/dev/null || true' EXIT
          sleep 1

          TEST_SRV=http://127.0.0.1:8899 sh tests/test-install.sh
          sh tests/test-watchdog.sh
          TEST_SRV=http://127.0.0.1:8899 sh tests/test-action.sh
          sh tests/test-service.sh
          sh tests/test-lib.sh

      - name: 打包
        run: |
          set -eu
          mkdir -p dist
          sh build.sh dist
          ls -l dist/

      - name: 校验 zip 结构
        run: |
          set -eu
          ZIP="dist/magpie-${{ steps.meta.outputs.ver }}.zip"
          echo "包内文件："
          unzip -l "$ZIP"

          # module.prop 必须在包根目录，否则 Magisk 装不上
          if ! unzip -l "$ZIP" | grep -qE '^ *[0-9]+ .* module\.prop$'; then
            echo "::error::module.prop 不在 zip 根目录"
            exit 1
          fi
          if unzip -l "$ZIP" | grep -qE ' (README\.md|LICENSE|CHANGELOG\.md|update\.json|build\.sh)$'; then
            echo "::error::zip 里混进了仓库文件"
            exit 1
          fi
          for f in service.sh action.sh uninstall.sh scripts/magpie.service; do
            if ! unzip -l "$ZIP" | grep -qE " $f$"; then
              echo "::error::zip 缺少 $f"
              exit 1
            fi
          done
          echo "结构检查通过"

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VER: ${{ steps.meta.outputs.ver }}
        run: |
          set -eu
          ZIP="dist/magpie-$VER.zip"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传资源"
            gh release upload "$TAG" "$ZIP" --clobber
          else
            # 说明先写到文件里（占位符后面替换），免得长文本被引号或反引号弄乱
            cat > NOTES.md <<'EOF'
          模块 __TAG__，由 __SHA__ 自动构建。

          本体没装也没关系：装上模块后点 `[执行]`，或跑
          `scripts/install.sh install --yes`，模块会下载并安装 magpie 本体
          （sha256 校验、原子替换、失败不留残骸）。已装好的本体不会被覆盖；
          升级用本体自己的 `magpie update`。

          - 安装与排障：[README](https://github.com/__REPO__#快速开始)
          - 变更记录：[CHANGELOG.md](https://github.com/__REPO__/blob/main/CHANGELOG.md)
          EOF
            sed -i "s|__TAG__|$TAG|g; s|__SHA__|$GITHUB_SHA|g; s|__REPO__|$REPO|g" NOTES.md
            gh release create "$TAG" "$ZIP" \
              --title "$TAG" \
              --notes-file NOTES.md
          fi

      - name: 同步 update.json
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VER: ${{ steps.meta.outputs.ver }}
          CODE: ${{ steps.meta.outputs.code }}
        run: |
          set -eu
          # 在 main 的最新提交上改这个文件，原因有两个：
          #   1. 从旧 tag 触发时，checkout 出来的不是 main，直接在它上面
          #      提交再推 main 会因为非快进被拒；
          #   2. 发旧版本不该把更新通道倒退，所以先比 versionCode。
          WT="$RUNNER_TEMP/main-wt"
          rm -rf "$WT"
          git fetch --quiet origin main
          git worktree add --quiet --detach "$WT" origin/main
          cd "$WT"

          CUR=$(sed -n 's/.*"versionCode"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p' update.json 2>/dev/null | head -1)
          if [ -n "$CUR" ] && [ "$CUR" -gt "$CODE" ]; then
            echo "main 上的 update.json 是更高版本（versionCode $CUR > $CODE），不回退更新通道，跳过"
            exit 0
          fi

          cat > update.json <<EOF
          {
            "version": "$VER",
            "versionCode": $CODE,
            "zipUrl": "https://github.com/$REPO/releases/download/$TAG/magpie-$VER.zip",
            "changelog": "https://raw.githubusercontent.com/$REPO/main/CHANGELOG.md"
          }
          EOF

          cat update.json

          if git diff --quiet -- update.json; then
            echo "update.json 无变化，跳过提交"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: update.json -> $TAG"

          # 另一个发版任务可能刚好也推了 main，重试一次
          if git push --quiet origin HEAD:main; then
            echo "update.json 已同步"
          else
            echo "推送被拒，跟 main 对齐后重试"
            git fetch --quiet origin main
            git rebase --quiet origin/main
            git push --quiet origin HEAD:main
            echo "update.json 已同步（重试成功）"
          fi
