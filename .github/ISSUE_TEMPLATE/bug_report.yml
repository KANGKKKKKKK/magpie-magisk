name: 问题反馈
description: 模块没按预期工作（服务起不来、装不上本体、面板打不开等）
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        先跑一次自检，很多问题它能直接说清原因：

        ```sh
        su -c sh /data/adb/modules/magpie/scripts/doctor.sh
        ```

        下面的信息请尽量填全 —— 缺了设备与版本，问题基本没法定位。

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 你期望什么、实际发生了什么。有报错原文就直接贴。
      placeholder: 点 [执行] 后……，日志里出现……
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: doctor.sh 输出
      description: 上面那条命令的完整输出。请先检查并遮住密钥、带密码的 URL 和不希望公开的网络信息。
      render: text
    validations:
      required: true

  - type: input
    id: module-version
    attributes:
      label: 模块版本
      description: 管理器模块页显示的那行，或 `grep version /data/adb/modules/magpie/module.prop`
      placeholder: v0.8 (1009)
    validations:
      required: true

  - type: input
    id: magpie-version
    attributes:
      label: magpie 本体版本
      description: '`su -c magpie --version`；未安装就写「未安装」'
      placeholder: magpie 0.1.4303
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备与系统
      description: 机型 + Android 版本 + 架构
      placeholder: 红米 K50 / Android 14 (HyperOS 2.0) / arm64
    validations:
      required: true

  - type: dropdown
    id: root-solution
    attributes:
      label: Root 方案
      options:
        - Magisk
        - KernelSU
        - APatch
        - 其它（请在下面说明）
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: |
        `su -c tail -n 50 /data/adb/magpie/run/magpie.log`
        以及（如果有）`/data/adb/magpie/run/watchdog.log`
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我跑过 `doctor.sh` 并把输出贴在上面
          required: true
        - label: 我贴出的内容里没有密钥、令牌、访问密码或带 `?k=` 的链接；已人工检查日志和截图
          required: true
